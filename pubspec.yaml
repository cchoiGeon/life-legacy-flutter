name: life_legacy
description: "Life Legacy — 말씀만 하시면 AI가 한 권의 자서전으로 써 드려요."

publish_to: 'none'

version: 0.1.0+1

environment:
  # Dart 3.6(Flutter 3.27) 이상 — `Color.withValues()`(AppShadows)를 쓴다.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── 상태관리 · DI · 라우팅 (Pickle · IAM과 동일 스택) ────────
  get: ^4.6.6
  get_storage: ^2.1.1

  # ── 기타 ────────────────────────────────────────────────────
  intl: ^0.19.0

  # Figma에서 내보낸 아이콘(assets/icons/*.svg)을 그대로 그린다.
  # 직접 Path로 옮겨 그리면 시안과 미세하게 어긋나서 에셋을 쓴다.
  flutter_svg: ^2.0.10
  speech_to_text: ^7.4.0
  dio: ^5.11.0
  showcaseview: ^5.1.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  just_audio: ^0.10.6
  record: ^7.1.1
  url_launcher: ^6.3.2

  # dio — RealApiClient(Nest /v1) HTTP.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 인증번호 3분 타이머를 실제로 3분 기다리지 않고 검증한다
  # (test/login_controller_test.dart).
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    # 본문 UI — Figma 시안의 Noto Sans KR.
    #
    # ⚠️ 구글이 배포하는 Noto Sans KR은 **가변 폰트 하나**뿐이다(정적 굵기 파일이
    #    없다). 그래서 파일을 굵기별로 나눠 등록할 수 없고, 여기서는 한 번만
    #    등록한 뒤 AppTypography가 `fontVariations`로 wght 축을 지정한다.
    #    `fontWeight`만 주면 굵기가 반영되지 않으니 반드시 토큰을 거쳐 쓴다.
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Variable.ttf

    # 명조 — 화면 제목 · 질문 · 책 본문.
    #
    # ⚠️ 시안(340:592)이 지정한 **Noto Serif KR** 그대로다. 예전에는 나눔명조로
    #    대체했는데 자형이 확연히 달라 시안과 겹쳐 보면 어긋난다.
    #
    # ⚠️ 이것도 가변 폰트 하나이고 **wght 기본값이 200(ExtraLight)** 이다.
    #    `fontWeight`만 주면 얇게 나오므로 `AppTypography`가 `fontVariations`로
    #    축을 직접 지정한다 — NotoSansKR과 같은 이유, 더 심한 증상.
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Variable.ttf
